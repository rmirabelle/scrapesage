[package]
name = "scrapesage"
version = "0.1.0"
description = "Find and download videos from your own list of web pages"
authors = ["Rob Mirabelle"]
edition = "2021"

[lib]
name = "scrapesage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
futures-util = "0.3"
tokio = { version = "1", features = ["fs", "io-util", "process", "sync", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip", "brotli"] }
scraper = "0.23"
url = "2"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
tauri-plugin-single-instance = "2"
windows = { version = "0.61.3", features = [
  "Win32_Foundation",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging"
] }
